services:
  arm-controller:
    build: .
    container_name: arm-controller
    restart: unless-stopped
    privileged: true
    init: true

    devices:
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb

    volumes:
      - ./arm_gamepad.py:/app/arm_gamepad.py:ro
      - /dev/input/by-id:/dev/input/by-id:ro
      - /dev/input/by-path:/dev/input/by-path:ro

    ports:
      - "5000:5000"

    environment:
      - PYTHONUNBUFFERED=1