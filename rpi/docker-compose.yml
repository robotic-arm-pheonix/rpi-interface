services:
  arm-controller:
    build: .
    container_name: arm-controller
    restart: unless-stopped
    privileged: true
    init: true

    devices:
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb

    volumes:
      - ./arm_gamepad.py:/app/arm_gamepad.py:ro

    environment:
      - PYTHONUNBUFFERED=1
      # Optional: force a specific pad node if auto-pick is wrong
      # - GAMEPAD_DEV=/dev/input/event7